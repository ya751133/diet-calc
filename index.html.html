<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>個人化食材營養與份量計算機</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --bg: #f8fafc;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --text-muted: #64748b;
    --carb: #f59e0b;
    --protein: #ef4444;
    --fat: #3b82f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    padding: 20px;
    display: flex;
    justify-content: center;
  }
  .container { max-width: 1200px; width: 100%; display: grid; grid-template-columns: 1fr; gap: 20px; }
  @media(min-width: 992px) {
    .container { grid-template-columns: 360px 1fr; align-items: start; }
  }
  .card {
    background: var(--card);
    border-radius: 12px;
    border: 1px solid var(--border);
    padding: 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
  }
  h2 { font-size: 1.15rem; margin-bottom: 14px; font-weight: 700; }
  .form-group { margin-bottom: 12px; }
  label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; }
  input[type="number"] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.95rem;
    background: #fff;
    color: var(--text);
  }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .btn {
    display: block;
    width: 100%;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.2s;
  }
  .btn:hover { background: var(--primary-hover); }
  .btn-outline {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    margin-top: 6px;
  }
  .btn-outline:hover { background: #f1f5f9; }

  /* Progress Display */
  .sidebar { position: sticky; top: 20px; }
  .macro-progress { margin-bottom: 12px; }
  .macro-header { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 4px; font-weight: 600; }
  .bar-container { width: 100%; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; }
  .bar { height: 100%; width: 0%; transition: width 0.2s ease; }
  .bar-cal { background: #10b981; }
  .bar-c { background: var(--carb); }
  .bar-p { background: var(--protein); }
  .bar-f { background: var(--fat); }

  /* Category Nav */
  .category-nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .badge-filter {
    padding: 6px 12px;
    background: #f1f5f9;
    border-radius: 20px;
    font-size: 0.82rem;
    cursor: pointer;
    border: 1px solid transparent;
    user-select: none;
  }
  .badge-filter.active {
    background: #e0f2fe;
    color: #0369a1;
    border-color: #bae6fd;
    font-weight: 600;
  }

  /* Food Table */
  .food-list { display: grid; gap: 10px; max-height: 640px; overflow-y: auto; padding-right: 4px; }
  .food-row {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    display: grid;
    grid-template-columns: 24px 1fr auto;
    align-items: center;
    gap: 12px;
    background: #fff;
    transition: background 0.15s, border-color 0.15s;
  }
  .food-row.selected { background: #f0fdf4; border-color: #86efac; }
  .food-title { font-size: 0.95rem; font-weight: 600; }
  .food-meta { font-size: 0.78rem; color: var(--text-muted); margin-top: 3px; }
  .food-control { display: flex; align-items: center; gap: 8px; }
  .food-control input[type="number"] { width: 75px; text-align: right; }
